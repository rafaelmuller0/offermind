name: OfferMind catalog refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
concurrency:
  group: offermind-catalog
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' && vars.OFFERMIND_CATALOG_ENABLED == 'true' && vars.OFFERMIND_PUBLIC_DATA_AUTHORIZED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect authorized ad catalog
        env:
          OFFERMIND_LICENSED_COUNTRIES: ${{ vars.OFFERMIND_LICENSED_COUNTRIES }}
          SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
          OFFERMIND_CATALOG_ENABLED: ${{ vars.OFFERMIND_CATALOG_ENABLED }}
          OFFERMIND_PUBLIC_DATA_AUTHORIZED: ${{ vars.OFFERMIND_PUBLIC_DATA_AUTHORIZED }}
        run: |
          for market in BR US; do
            if [[ ",$OFFERMIND_LICENSED_COUNTRIES," == *",$market,"* ]]; then node --experimental-strip-types scripts/refresh-catalog.mjs "$market"; fi
          done
      - name: Publish refreshed catalog
        run: |
          git config user.name "offermind-catalog[bot]"
          git config user.email "offermind-catalog[bot]@users.noreply.github.com"
          git add public/offermind-catalog-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh observed offer catalog"
          git pull --rebase origin main
          git push origin HEAD:main
